    - name: leg_kicks_attempted
      data_type: float
      description: "leg_kicks_attempted"
    - name: leg_kicks_accuracy_percentage
      data_type: float
      description: "leg_kicks_accuracy_percentage"
    - name: significant_distance_strikes_landed
      data_type: float
      description: "significant_distance_strikes_landed"
    - name: significant_distance_strikes_attempted
      data_type: float
      description: "significant_distance_strikes_attempted"
    - name: significant_distance_strikes_accuracy_percentage
      data_type: float
      description: "significant_distance_strikes_accuracy_percentage"
    - name: significant_clinch_strikes_landed
      data_type: float
      description: "significant_clinch_strikes_landed"
    - name: significant_clinch_strikes_attempted
      data_type: float
      description: "significant_clinch_strikes_attempted"
    - name: significant_clinch_strikes_accuracy_percentage
      data_type: float
      description: "significant_clinch_strikes_accuracy_percentage"
    - name: significant_ground_strikes_landed
      data_type: float
