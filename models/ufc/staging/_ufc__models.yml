models:
  - name: stg_ufc__fighter
    description: "fighter attributtes and global statistcs"
    columns:
      - name: fighter_id
        data_type: varchar
        description: "unique identifier of the fighter"
        data_tests:
        - not_null
        - unique
      - name: name
        data_type: varchar
        description: "name of the fighter"
      - name: nick_name
        data_type: varchar
        description: "nickname of the fighter"
      - name: date_of_birthay
        data_type: varchar
        description: "date of birthay"
      - name: height
        data_type: float
        description: "height of the fighter in centimeters"
      - name: reach
        data_type: float
        description: "reach of the fighter in centimeters"
      - name: stance_id
        data_type: varchar
        description: "id of the normal stance of the fighter"
        data_tests:
        - not_null
        - relationships:
            to: ref('stg_ufc__fighter')
            field: stance_id
      
  - name: stg_ufc__stance
    description: "stances of the fighters"
    columns:
      - name: stance_id 
        data_type: varchar
        description: "unique identifier of the stances"
        data_tests:
        - not_null
        - unique
      - name: fighter_stance
        data_type: varchar
        description: "name of the fighters stances"

      
  - name: stg_ufc__fight
    description: "data of all the fights of the events, granularity: fight"
    columns:
      - name: fight_id
        data_type: varchar
        description: "unique identificator of the fight"
        data_tests:
        - not_null
        - unique
      - name: event_id
        data_type: varchar
        description: "unique identificator of the event" 
        data_tests:
        - not_null
        - relationships:
            to: ref('stg_ufc__event')
            field: event_id
      - name: division_id
        data_type: varchar
        description: "unique identifier of the fight division"
        data_tests:
        - not_null
        - relationships:
            to: ref('stg_ufc__division')
            field: division_id
      - name: referee_id
        data_type: varchar
        description: "unique identifier of the fights referee"  
        data_tests:
        - not_null
        - relationships:
            to: ref('stg_ufc__referee')
            field: referee_id
      - name: method_id
        data_type: varchar
        description: "unique identifier of the method by the combat ends"   
        data_tests:
        - not_null
        - relationships:
            to: ref('stg_ufc__finish_method')
            field: method_id       
      - name: title_fight
        data_type: boolean
        description: "indicates whether the fight is for the belt"
      - name: finish_round
        data_type: number
        description: "round in which the fight finished"
      - name: total_rounds
        data_type: number
        description: "total rounds of the fight"
      - name: fight_time_sec
        data_type: number
        description: "duration of the fight in seconds"

  - name: stg_ufc__division
    description: "different divisions of the UFC"
    columns:
      - name: division_id
        data_type: varchar
        description: "unique identifier of the divisions"
        data_tests:
        - not_null
        - unique
      - name: division_name
        data_type: varchar
        description: "name of the divisions of the UFC"

  - name: stg_ufc__referee
    description: "different referees of the UFC"
    columns:
      - name: referee_id
        data_type: varchar
        description: "unique identifier of the referees"
        data_tests:
        - not_null
        - unique
      - name: referee_name
        data_type: varchar
        description: "name of the referees of the UFC"

  - name: stg_ufc__finish_method
    description: "method by which the fight ends"
    columns:
      - name: method_id
        data_type: varchar
        description: "unique identifier of the method"
        data_tests:
        - unique
        - not_null
      - name: method_name
        data_type: varchar
        description: "name of the methods by which the fight ends"
  
  - name: stg_ufc__event
    description: "Information about the event, granularity: event"
    columns:
      - name: event_id
        data_type: varchar
        description: "identificator of the event"
        data_tests:
        - not_null
        - unique
      - name: event_name
        data_type: varchar
        description: "name of each event"
      - name: date
        data_type: date
        description: "date on which the event took place"
      - name: event_location
        data_type: varchar
        description: "location on which the event took place"
  
  - name: stg_ufc__fight_performance 
    description: "performance of the fighters y each fight, granularity: fighter"
    columns:
    - name: fight_performance_id
      data_type: varchar
      description: "surrogate key of the fight and fighter id"
      data_tests:
        - not_null
        - unique
    - name: fight_id
      data_type: varchar
      description: "identificator of the fight"
    - name: fighter_id
      data_type: varchar
      description: "identificator of the fighter"
    - name: winner
      data_type: boolean
      description: "indicates whether the fighter wins in his fight or not"
    - name: Knockdowns_landed
      data_type: number
      description: "Knockdowns landed by the fihgter"
    - name: significant_strikes_landed
      data_type: float
      description: "significant strikes landed by the fihgter"
    - name: significant_strikes_attempted
      data_type: float
      description: "significant strikes attempted by the fihgter"
    - name: significant_strikes_accuracy_percentage
      data_type: float
      description: "significant strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: total_strikes_landed
      data_type: float
      description: "total strikes landed"
    - name: total_strikes_attempted
      data_type: float
      description: "total strikes attempted"
    - name: total_strikes_accuracy_percentage
      data_type: float
      description: "total strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: takedowns_landed
      data_type: float
      description: "takedowns landed by the fihgter"
    - name: takedowns_attempted
      data_type: float
      description: "takedowns attempted by the fihgter"
    - name: takedowns_accuracy_percentage
      data_type: float
      description: "takedowns accuracy percentage"
      data_tests:
        - percentage_test
    - name: submission_attempts
      data_type: float
      description: "submission attempts"
    - name: control_over_the_rival_in_seconds
      data_type: number
      description: "control over the rival in seconds"
    - name: significant_head_strikes_landed
      data_type: float
      description: "significant head strikes landed by the fihgter"
    - name: significant_head_strikes_attempted
      data_type: float
      description: "significant head strikes attempted by the fihgter"
    - name: significant_head_strikes_accuracy_percentage
      data_type: float
      description: "significant head strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: significant_body_strikes_landed
      data_type: float
      description: "significant body strikes landed by the fihgter"
    - name: significant_body_strikes_attempted
      data_type: float
      description: "significant body strikes attempted by the fihgter"
    - name: significant_body_strikes_accuracy_percentage
      data_type: float
      description: "significant body strikes accuracy percentage "
      data_tests:
        - percentage_test
    - name: leg_kicks_landed
      data_type: float
      description: "leg kicks landed by the fihgter"
    - name: leg_kicks_attempted
      data_type: float
      description: "leg kicks attempted by the fihgter"
    - name: leg_kicks_accuracy_percentage
      data_type: float
      description: "leg kicks accuracy percentage"
      data_tests:
        - percentage_test
    - name: significant_distance_strikes_landed
      data_type: float
      description: "significant distance strikes landed by the fihgter"
    - name: significant_distance_strikes_attempted
      data_type: float
      description: "significant distance strikes attempted by the fihgter"
    - name: significant_distance_strikes_accuracy_percentage
      data_type: float
      description: "significan distance strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: significant_clinch_strikes_landed
      data_type: float
      description: "significant clinch strikes landed by the fihgter"
    - name: significant_clinch_strikes_attempted
      data_type: float
      description: "significant clinch strikes attempted by the fihgter"
    - name: significant_clinch_strikes_accuracy_percentage
      data_type: float
      description: "significant clinch strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: significant_ground_strikes_landed
      data_type: float
      description: "significant ground strikes landed by the fihgter"
    - name: significant_ground_strikes_attempted
      data_type: float
      description: "significant ground strikes attempted by the fihgter"
    - name: significant_ground_strikes_accuracy_percentage
      data_type: float
      description: "significant ground strikes accuracy percentage"
      data_tests:
        - percentage_test
    - name: significant_head_strikes_landed_percentage
      data_type: float
      description: "significant head strikes landed percentage"
      data_tests:
        - percentage_test
    - name: significant_body_strikes_landed_percentage
      data_type: float
      description: "significant body strikes landed percentage"
      data_tests:
        - percentage_test
    - name: significant_leg_strikes_landed_percentage
      data_type: float
      description: "significant leg strikes landed percentage"
      data_tests:
        - percentage_test
    - name: significant_distance_strikes_landed_percentage
      data_type: float
      description: "significant distance strikes landed percentage"
      data_tests:
        - percentage_test
    - name: significant_clinch_strikes_landed_percentage
      data_type: float
      description: "significant clinch strikes landed percentage"
      data_tests:
        - percentage_test
    - name: significant_ground_strikes_landed_percentage
      data_type: float
      description: "significant ground strikes landed percentage"
      data_tests:
        - percentage_test







      