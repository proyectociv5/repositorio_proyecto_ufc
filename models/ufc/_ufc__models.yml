models:
  - name: fighter
    description: "fighter attributtes and global statistcs"
    columns:
      - name: fighter_id
        data_type: varchar
        description: "unique identifier of the fighter"
      - name: name
        data_type: varchar
        description: "name of the fighter"
      - name: nick_name
        data_type: varchar
        description: "nickname of the fighter"
      - name: date_of_birthay
        data_type: varchar
        description: "date of birthay"
      - name: height
        data_type: float
        description: "height of the fighter in centimeters"
      - name: reach
        data_type: float
        description: "reach of the fighter in centimeters"
      - name: stance_id
        data_type: varchar
        description: "id of the normal stance of the fighter"
      
  - name: stance
    description: "fighter attributtes and global statistcs"
    columns:
      - name: stance_id
        data_type: varchar
        description: "unique identifier of the stances"
      - name: fighter_stance
        data_type: varchar
        description: "name of the fighters stances"

      
  - name: fight
    description: "data of all the fights of the events, granularity: fight"
    columns:
      - name: fight_id
        data_type: varchar
        description: "unique identificator of the fight"
      - name: event_id
        data_type: varchar
        description: "unique identificator of the event" 
      - name: division_id
        data_type: varchar
        description: "unique identifier of the fight division"
      - name: referee_id
        data_type: varchar
        description: "unique identifier of the fights referee"  
      - name: method_id
        data_type: varchar
        description: "unique identifier of the method by the combat ends"          
      - name: title_fight
        data_type: boolean
        description: "indicates whether the fight is for the belt"
      - name: finish_round
        data_type: number
        description: "round in which the fight finished"
      - name: total_rounds
        data_type: number
        description: "total rounds of the fight"
      - name: fight_time_sec
        data_type: number
        description: "duration of the fight in seconds"
      
     
      
    



      