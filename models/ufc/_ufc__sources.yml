            description: "red corner significant_clinch_strikes_accuracy_percentage"
          - name: r_ground_landed
            data_type: float
            description: "red corner significant_ground_strikes_landed"
          - name: r_ground_atmpted
            data_type: float
            description: "red corner significant_ground_strikes_attempted"
          - name: r_ground_acc
            data_type: float
            description: "red corner significant_ground_strikes_accuracy_percentage"
          - name: r_landed_head_per
            data_type: float
            description: "red corner significant_head_strikes_landed_percentage"
          - name: r_landed_body_per
            data_type: float
            description: "red corner significant_body_strikes_landed_percentage"
          - name: r_landed_leg_per
