            description: "blue corner takedowns_accuracy_percentage"
          - name: b_sub_att
            data_type: float
            description: "blue corner submission_attempts "
          - name: b_ctrl
            data_type: float
            description: "blue corner control_over_the_rival_in_seconds"
          - name: b_head_landed
            data_type: float
            description: "blue corner significant_head_strikes_landed"
          - name: b_head_atmpted
            data_type: float
            description: "blue corner significant_head_strikes_attempted"
          - name: b_head_acc
            data_type: float
            description: "blue corner significant_head_strikes_accuracy_percentage"
          - name: b_body_landed
