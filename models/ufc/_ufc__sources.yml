sources:

  - name: raw # name of the source 
    schema: raw # this is the schema our raw data lives in
    database: "ufc_daniel_bronze" # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    tables:
      - name: event_details
        description: ""
        columns:
          - name: event_id
            data_type: varchar
            description: ""
            data_tests:
              - not_null
          - name: fight_id
            data_type: varchar
            description: ""
            data_tests:
              - unique
              - not_null
          - name: date
            data_type: varchar
            description: ""
            data_tests:
              - not_null
          - name: location
            data_type: varchar
            description: ""
            data_tests:
              - not_null
          - name: winner
            data_type: varchar
            description: ""
            
          - name: winner_id
            data_type: varchar
            description: ""
            

      - name: fight_details
        description: "characteristics and statistics of the fight"
        columns:
          - name: event_name
            data_type: varchar
            description: "name of the event"
            data_tests:
              - not_null
          - name: event_id
            data_type: varchar
            description: "unique identificator of the event"
            data_tests:
              - not_null
          - name: fight_id
            data_type: varchar
            description: "unique identificator of the fight"
            data_tests:
              - unique
              - not_null
          - name: r_name
            data_type: varchar
            description: "name of the red corners fighter"       
          - name: r_id
            data_type: varchar
            description: "unique identificator of the red corners fighter"
            data_tests:
              - not_null
          - name: b_name
            data_type: varchar
            description: "name of the blue corners fighter"
          - name: b_id
            data_type: varchar
            description: "unique identificator of the blue corners fighter"
            data_tests:
              - not_null
          - name: division
            data_type: varchar
            description: "division in which the fighter fights"            
          - name: title_fight
            data_type: number
            description: "indicates whether the fight is for the belt"
          - name: method
            data_type: varchar
            description: "method by the combat ends"
            data_tests:
              - not_null
              - accepted_values:
                  values: ['Submission',
                            'Overturned',
                            'DQ',
                            'Decision - Unanimous',
                            'KO/TKO',
                            'Could Not Continue',
                            'Other',
                            'Decision - Majority',
                            'Decision - Split',
                            "TKO - Doctor''s Stoppage"]

          - name: finish_round
            data_type: number
            description: "round in which the fight finished"
          - name: match_time_sec
            data_type: number
            description: "duration of the fight in seconds"
          - name: total_rounds
            data_type: number
            description: "total rounds of the fight"
          - name: referee
            data_type: varchar
            description: "name of the fights referee"
          - name: r_kd
            data_type: number
            description: "red corner Knockdowns_landed"
          - name: r_sig_str_landed
            data_type: float
            description: "red corner significant_strikes_landed"
          - name: r_sig_str_atmpted
            data_type: float
            description: "red corner significant_strikes_attempted"
          - name: r_sig_str_acc
            data_type: float
            description: "red corner significant_strikes_accuracy_percentage"
          - name: r_total_str_landed
            data_type: float
            description: "red corner total_strikes_landed"
          - name: r_total_str_atmpted
            data_type: float
            description: "red corner total_strikes_attempted"
          - name: r_total_str_acc
            data_type: float
            description: "red corner total_strikes_accuracy_percentage"
          - name: r_td_landed
            data_type: float
            description: "red corner takedowns_landed"
          - name: r_td_atmpted
            data_type: float
            description: "red corner takedowns_attempted"
          - name: r_td_acc
            data_type: float
            description: "red corner takedowns_accuracy_percentage"
          - name: r_sub_att
            data_type: float
            description: "red corner submission_attempts"
          - name: r_ctrl
            data_type: float
            description: "red corner control_over_the_rival_in_seconds"
          - name: r_head_landed
            data_type: float
            description: "red corner significant_head_strikes_landed"
          - name: r_head_atmpted
            data_type: float
            description: "red corner significant_head_strikes_attempted"
          - name: r_head_acc
            data_type: float
            description: "red corner significant_head_strikes_accuracy_percentage"
          - name: r_body_landed
            data_type: float
            description: "red corner significant_body_strikes_landed"
          - name: r_body_atmpted
            data_type: float
            description: "red corner significant_body_strikes_attempted"
          - name: r_body_acc
            data_type: float
            description: "red corner significant_body_strikes_accuracy_percentage"
          - name: r_leg_landed
            data_type: float
            description: "red corner leg_kicks_landed"
          - name: r_leg_atmpted
            data_type: float
            description: "red corner leg_kicks_attempted"
          - name: r_leg_acc
            data_type: float
            description: "red corner leg_kicks_accuracy_percentage"
          - name: r_dist_landed
            data_type: float
            description: "red corner significant_distance_strikes_landed"
          - name: r_dist_atmpted
            data_type: float
            description: "red corner significant_distance_strikes_attempted"
          - name: r_dist_acc
            data_type: float
            description: "red corner significant_distance_strikes_accuracy_percentage"
          - name: r_clinch_landed
